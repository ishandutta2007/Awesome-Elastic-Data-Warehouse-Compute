<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .code-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #38bdf8;
    }

    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
      50% { transform: translate(40px, 20px) scale(1.15); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1.1); opacity: 0.4; }
      50% { transform: translate(-30px, -25px) scale(0.95); opacity: 0.65; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes pingNode {
      0% { r: 5; opacity: 1; }
      75%, 100% { r: 15; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashStream 4s linear infinite;
    }
    .pill-floating-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-floating-2 { animation: floatPill2 6s ease-in-out infinite; }
    .ping-circle { animation: pingNode 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- 1. Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- 2. Grid Architecture Underlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- 3. Dynamic Ambient Glowing Orbs (Behind content) -->
  <g opacity="0.5">
    <circle class="orb-1" cx="220" cy="90" r="140" fill="#0284c7" filter="url(#glow-cyan)" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#7c3aed" filter="url(#glow-purple)" />
    <circle class="orb-1" cx="820" cy="80" r="100" fill="#2563eb" filter="url(#glow-cyan)" />
  </g>

  <!-- 4. Dynamic Geometric Elastic Compute Diagram (Right Background) -->
  <g opacity="0.75" transform="translate(680, 40)">
    <!-- Interconnecting data streams -->
    <path class="stream-line" d="M 120 70 L 260 130" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path class="stream-line" d="M 260 130 L 400 70" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path class="stream-line" d="M 260 130 L 190 230" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.6"/>
    <path class="stream-line" d="M 260 130 L 330 230" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Dynamic Compute Nodes -->
    <!-- Node 1: Virtual Warehouse Engine -->
    <g class="pill-floating-1" transform="translate(200, 100)">
      <rect width="120" height="60" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="60" y="27" text-anchor="middle" class="badge-text" fill="#38bdf8">COMPUTE</text>
      <text x="60" y="45" text-anchor="middle" class="code-text">Autoscaling</text>
      <circle cx="15" cy="15" r="4" fill="#38bdf8" filter="url(#node-glow)"/>
      <circle class="ping-circle" cx="15" cy="15" fill="#38bdf8" opacity="0.75" />
    </g>

    <!-- Node 2: Worker Node A -->
    <g class="pill-floating-2" transform="translate(60, 40)">
      <rect width="110" height="50" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="55" y="24" text-anchor="middle" class="badge-text" fill="#818cf8">WORKER</text>
      <text x="55" y="40" text-anchor="middle" class="code-text">MPP Query</text>
    </g>

    <!-- Node 3: Worker Node B -->
    <g class="pill-floating-1" transform="translate(340, 40)">
      <rect width="110" height="50" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="55" y="24" text-anchor="middle" class="badge-text" fill="#818cf8">WORKER</text>
      <text x="55" y="40" text-anchor="middle" class="code-text">Scale-to-Zero</text>
    </g>

    <!-- Node 4: Decoupled Storage Lakehouse -->
    <g class="pill-floating-2" transform="translate(190, 210)">
      <rect width="140" height="50" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
      <text x="70" y="24" text-anchor="middle" class="badge-text" fill="#c084fc">STORAGE</text>
      <text x="70" y="40" text-anchor="middle" class="code-text">S3 / Iceberg / Delta</text>
    </g>
  </g>

  <!-- 5. Foreground Content Layer (Text strictly clear & in foreground) -->
  <g transform="translate(80, 95)">
    <!-- Category Pill -->
    <g class="pill-floating-1">
      <rect width="320" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#22c55e" />
      <text x="35" y="22" class="badge-text" fill="#f8fafc">CURATED AWESOME ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title-text" fill="url(#primary-grad)">
      Awesome Elastic Data Warehouse
    </text>
    <text x="0" y="145" class="title-text" fill="#ffffff">
      Compute &amp; Query Engines
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">
      Decoupled Virtual Warehouses, Concurrency Scaling, Serverless &amp; Self-Hosted OLAP
    </text>

    <!-- Tech Badges / Tags -->
    <g transform="translate(0, 225)">
      <!-- Badge 1: Snowflake / Redshift / BigQuery -->
      <g>
        <rect width="150" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="75" y="19" text-anchor="middle" class="badge-text" fill="#93c5fd">⚡ Cloud Serverless</text>
      </g>
      <!-- Badge 2: Trino / Presto / ClickHouse -->
      <g transform="translate(160, 0)">
        <rect width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="72" y="19" text-anchor="middle" class="badge-text" fill="#a78bfa">🚀 Open MPP OLAP</text>
      </g>
      <!-- Badge 3: Iceberg / Decoupled Lakehouse -->
      <g transform="translate(315, 0)">
        <rect width="150" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="75" y="19" text-anchor="middle" class="badge-text" fill="#67e8f9">🧊 Decoupled Storage</text>
      </g>
      <!-- Badge 4: Kubernetes Native -->
      <g transform="translate(475, 0)">
        <rect width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="72" y="19" text-anchor="middle" class="badge-text" fill="#f472b6">☸️ Cloud-Native K8s</text>
      </g>
    </g>
  </g>
</svg>
