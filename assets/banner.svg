<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0b1329"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyan-blue" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="purple-pink" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-purple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="node-glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.45}50%{transform:translate(40px,20px) scale(1.15);opacity:.7}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1.1);opacity:.4}50%{transform:translate(-30px,-25px) scale(.95);opacity:.65}}@keyframes dashStream{0%{stroke-dashoffset:120}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes pingNode{0%{r:5;opacity:1}75%{r:15;opacity:0}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0;letter-spacing:.5px}.code-text{font-family:&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace;font-size:11px;fill:#38bdf8}.orb-1{animation:pulseOrb1 9s ease-in-out infinite}.orb-2{animation:pulseOrb2 11s ease-in-out infinite}.stream-line{stroke-dasharray:8 6;animation:dashStream 4s linear infinite}.pill-floating-1{animation:floatPill1 5s ease-in-out infinite}.pill-floating-2{animation:floatPill2 6s ease-in-out infinite}.ping-circle{animation:pingNode 2.2s cubic-bezier(0,.2,.8,1) infinite}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".5"><circle cx="220" cy="90" r="140" fill="#0284c7" class="orb-1" filter="url(#glow-cyan)"/><circle cx="980" cy="280" r="160" fill="#7c3aed" class="orb-2" filter="url(#glow-purple)"/><circle cx="820" cy="80" r="100" fill="#2563eb" class="orb-1" filter="url(#glow-cyan)"/></g><g opacity=".75"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 120 70 L 260 130" class="stream-line" opacity=".6" transform="translate(680, 40)"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 260 130 L 400 70" class="stream-line" opacity=".6" transform="translate(680, 40)"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 260 130 L 190 230" class="stream-line" opacity=".6" transform="translate(680, 40)"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 260 130 L 330 230" class="stream-line" opacity=".6" transform="translate(680, 40)"/><g class="pill-floating-1" transform="translate(680, 40) translate(200, 100)"><rect width="120" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="10"/><text x="60" y="27" fill="#38bdf8" class="badge-text" text-anchor="middle">COMPUTE</text><text x="60" y="45" class="code-text" text-anchor="middle">Autoscaling</text><circle cx="15" cy="15" r="4" fill="#38bdf8" filter="url(#node-glow)"/><circle cx="15" cy="15" fill="#38bdf8" class="ping-circle" opacity=".75"/></g><g class="pill-floating-2" transform="translate(680, 40) translate(60, 40)"><rect width="110" height="50" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" rx="8"/><text x="55" y="24" fill="#818cf8" class="badge-text" text-anchor="middle">WORKER</text><text x="55" y="40" class="code-text" text-anchor="middle">MPP Query</text></g><g class="pill-floating-1" transform="translate(680, 40) translate(340, 40)"><rect width="110" height="50" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" rx="8"/><text x="55" y="24" fill="#818cf8" class="badge-text" text-anchor="middle">WORKER</text><text x="55" y="40" class="code-text" text-anchor="middle">Scale-to-Zero</text></g><g class="pill-floating-2" transform="translate(680, 40) translate(190, 210)"><rect width="140" height="50" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" rx="8"/><text x="70" y="24" fill="#c084fc" class="badge-text" text-anchor="middle">STORAGE</text><text x="70" y="40" class="code-text" text-anchor="middle">S3 / Iceberg / Delta</text></g></g><g><g class="pill-floating-1" transform="translate(80, 95)"><rect width="320" height="34" fill="#1e293b" fill-opacity=".8" stroke="#38bdf8" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#22c55e"/><text x="35" y="22" fill="#f8fafc" class="badge-text">CURATED AWESOME ARCHITECTURE</text></g><text x="0" y="95" fill="url(#primary-grad)" class="title-text" transform="translate(80, 95)">Awesome Elastic Data Warehouse</text><text x="0" y="145" fill="#fff" class="title-text" transform="translate(80, 95)">Compute &amp; Query Engines</text><text x="0" y="195" class="subtitle-text" transform="translate(80, 95)">Decoupled Virtual Warehouses, Concurrency Scaling, Serverless &amp; Self-Hosted OLAP</text><g><g transform="translate(80, 95) translate(0, 225)"><rect width="150" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="75" y="19" fill="#93c5fd" class="badge-text" text-anchor="middle">⚡ Cloud Serverless</text></g><g transform="translate(80, 95) translate(0, 225) translate(160, 0)"><rect width="145" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="72" y="19" fill="#a78bfa" class="badge-text" text-anchor="middle">🚀 Open MPP OLAP</text></g><g transform="translate(80, 95) translate(0, 225) translate(315, 0)"><rect width="150" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="75" y="19" fill="#67e8f9" class="badge-text" text-anchor="middle">🧊 Decoupled Storage</text></g><g transform="translate(80, 95) translate(0, 225) translate(475, 0)"><rect width="145" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="72" y="19" fill="#f472b6" class="badge-text" text-anchor="middle">☸️ Cloud-Native K8s</text></g></g></g></svg>